name: Build and deploy

on:
  push:
    branches: [main, claude/northern-rivers-housing-tracker-yj20s8]
    paths-ignore: ["README.md"]
  schedule:
    - cron: "41 17 3 2,5,8,11 *"   # quarterly, after each G-NAF release: refresh address locations
  workflow_dispatch:
    inputs:
      rebuild_geo:
        description: "Rebuild address locations from G-NAF"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  address-locations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # lets us see whether this push changed the builder
      - name: Decide whether to rebuild
        id: need
        run: |
          if [ ! -f data/geo.json ] || [ ! -f data/suburbs.json ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.rebuild_geo }}" = "true" ] \
             || git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^scripts/build_geo.py$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Address locations are up to date."
          fi
      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Build data/geo.json from G-NAF
        if: steps.need.outputs.run == 'true'
        run: python scripts/build_geo.py
      - name: Commit
        if: steps.need.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo.json data/suburbs.json
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Update address locations from G-NAF $(date -u +%F)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the app's automated checks
        run: node --test tests/*.test.mjs

  deploy:
    needs: [address-locations, tests]   # nothing is published if a check fails
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # includes any data commit made above
      - uses: actions/configure-pages@v5
      - name: Remove files the app does not need
        run: rm -rf .github scripts tests data/sales_db.csv.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
